- name: Get latest release information of ros-apt-source package
  ansible.builtin.uri:
    url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
    method: GET
    return_content: true
  register: ros2_apt_release_info

- name: Extract latest version of ros-apt-source package
  ansible.builtin.set_fact:
    ros2_apt_source_version: "{{ (ros2_apt_release_info.content | from_json).tag_name }}"

- name: Save result of 'dpkg --print-architecture'
  ansible.builtin.command: dpkg --print-architecture
  register: ros2__deb_architecture
  changed_when: false

- name: Save result of 'source /etc/os-release && echo $UBUNTU_CODENAME'
  ansible.builtin.shell: bash -c 'source /etc/os-release && echo $UBUNTU_CODENAME'
  register: ros2__ubuntu_codename
  changed_when: false

- name: Get ros2-apt-source package
  ansible.builtin.get_url:
    url: https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros2_apt_source_version }}/ros2-apt-source_{{ ros2_apt_source_version }}.{{ ros2__ubuntu_codename.stdout }}_all.deb
    dest: /tmp/ros2-apt-source.deb
    mode: "0644"

- name: Install ros2-apt-source package
  ansible.builtin.apt:
    deb: /tmp/ros2-apt-source.deb
    state: present
  become: true

- name: Delete installed .deb file
  ansible.builtin.file:
    path: /tmp/ros2-apt-source.deb
    state: absent

- name: Install ros-{{ rosdistro + '-' + installation_type }}
  become: true
  ansible.builtin.apt:
    name: ros-{{ rosdistro }}-{{ installation_type }}
    state: latest
    update_cache: true

- name: Add PATH to .bashrc
  ansible.builtin.lineinfile:
    dest: ~/.bashrc
    line: source /opt/ros/{{ rosdistro }}/setup.bash
    state: present
    create: true
    mode: 0644
